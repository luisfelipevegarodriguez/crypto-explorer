name: Bug
description: Algo del explorador falla o muestra datos que no corresponden.
title: "Bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Describe el fallo. No pegues `CRYPTOAPIS_API_KEY` ni ningún otro secreto.
  - type: textarea
    id: que-pasa
    attributes:
      label: Qué pasa
      description: Qué ves y qué esperabas.
    validations:
      required: true
  - type: input
    id: ruta
    attributes:
      label: Ruta
      description: Página o endpoint afectado.
      placeholder: /block/840000
    validations:
      required: true
  - type: dropdown
    id: modo
    attributes:
      label: Modo
      description: En modo demo la app no llama a Crypto APIs. No pegues la clave.
      options:
        - Demo, sin clave
        - Con clave en el entorno
        - No lo sé
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. npm install
        2. npm run dev
        3. Abrir /block/840000
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Salida de terminal o JSON de la API, sin secretos.
      render: shell
